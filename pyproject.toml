[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visbench"
version = "0.1.0.dev0"
description = "Probing vision backbones across high-, mid- and low-level computer vision tasks"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "computer-vision",
    "benchmark",
    "representation-learning",
    "probing",
    "foundation-models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Upper bounds are deliberate: this is a reproducible benchmark library, so a
# minor release of a dependency must not silently change reported numbers.
# Exact pins live in the lockfile (see README, "Reproducibility").
dependencies = [
    "torch>=2.0,<3.0",
    "torchvision>=0.15,<1.0",
    "numpy>=1.24,<3.0",
    "pillow>=9.0,<12.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
# Backbone weights come from upstream repos; keep them optional so a user
# probing only DINOv2 need not install OpenCLIP.
clip = ["open_clip_torch>=2.24,<3.0"]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.8,<2.0",
]
all = ["visbench[clip]"]

[project.urls]
Homepage = "https://github.com/turhancan97/VisBench"
Issues = "https://github.com/turhancan97/VisBench/issues"

# CLI is explicitly deferred to v0.2 — the Python API must stabilise first.
# [project.scripts]
# visbench = "visbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["visbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: requires downloading backbone weights or a GPU",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
