[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visbench"
version = "0.8.0"
description = "Probing vision backbones across high-, mid- and low-level computer vision tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Turhan Can Kargın", email = "turhancan.kargin@gmail.com" }]
keywords = [
    "computer-vision",
    "benchmark",
    "representation-learning",
    "probing",
    "foundation-models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Upper bounds are deliberate: this is a reproducible benchmark library, so a
# minor release of a dependency must not silently change reported numbers.
# Exact pins live in the lockfile (see README, "Reproducibility").
dependencies = [
    "torch>=2.0,<3.0",
    "torchvision>=0.15,<1.0",
    "numpy>=1.24,<3.0",
    "pillow>=9.0,<12.0",
    "scikit-learn>=1.3,<2.0",
]

[project.optional-dependencies]
# Backbone weights come from upstream repos; keep them optional so a user
# probing only DINOv2 need not install OpenCLIP.
clip = ["open_clip_torch>=2.24,<4.0"]
timm = ["timm>=1.0,<2.0"]
# Only push/pull need this. Saving and loading a probe to a local path works in
# a core install, so a user who never touches the Hub never installs a network
# client -- and `import visbench.hub` must keep working without it.
hub = ["huggingface_hub>=0.23,<2.0"]
# Building the documentation site. Deliberately NOT part of `all`: that extra is
# the runtime-capability set, and slow.yml installs it -- pulling Sphinx into a
# weights-downloading test run is noise. Upper bounds because a Furo release
# changing `light_logo` semantics should not silently alter the published site.
docs = [
    "sphinx>=7.3,<9.0",
    "furo>=2024.1,<2026.0",
    "myst-parser>=3.0,<5.0",
    "sphinx-copybutton>=0.5,<1.0",
]
dev = [
    # The issue-template test parses .github/ISSUE_TEMPLATE/*.yml. PyYAML is
    # present transitively via timm, but CI installs `.[dev]` only -- so
    # relying on that would have failed there while passing locally.
    "pyyaml>=6.0,<7.0",
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.8,<2.0",
]
all = ["visbench[clip,timm,hub]"]

[project.urls]
Homepage = "https://github.com/turhancan97/VisBench"
Documentation = "https://turhancan97.github.io/VisBench/"
Issues = "https://github.com/turhancan97/VisBench/issues"

[project.scripts]
visbench = "visbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["visbench"]

[tool.hatch.build.targets.sdist]
# The rendered gallery is ~1.9 MB of documentation figures that nobody
# installing the package needs, and it would nearly triple the sdist. The
# README and the docs site reference them by URL, so excluding them here costs
# nothing: `scripts/render_gallery.py` regenerates the lot from one command.
exclude = ["docs/_static/gallery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselected by default so a plain `pytest` never downloads weights. An explicit
# `-m slow` on the command line overrides this, since pytest honours the last -m.
addopts = "-m 'not slow'"
markers = [
    "slow: requires downloading backbone weights or a GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B905 (`zip()` without `strict=`) is enforced, not ignored. It became reachable
# when the floor moved to 3.10, and every call site has been given an explicit
# answer: strict=True wherever the two arguments encode a pairing (features to
# targets, keys to entries, layers to outputs), strict=False only where the
# raggedness is the point. A silently truncating zip is the failure mode
# CLAUDE.md warns about for targets travelling by index -- it still trains.

[tool.mypy]
# NOT the 3.10 this package supports, deliberately, and the reason generalises:
# mypy parses the *dependencies'* sources and stubs under this version too, and
# they use newer syntax than we do. torch has `match` statements (3.10+); numpy
# 2.x's __init__.pyi has PEP 695 `type` statements (3.12+). Set this too low and
# mypy reports a syntax error inside numpy or torch and stops with "errors
# prevented further checking" -- failing without checking a single line of
# visbench, which is what it did for five commits after the check became gating.
#
# So this tracks the newest syntax any dependency stub uses, not our own floor,
# and will need raising again as they move. Keep it equal to the lint job's
# python-version in .github/workflows/ci.yml.
#
# 3.10 support is still enforced, by two more direct checks: ruff's
# target-version = "py310" rejects newer syntax in our own code, and the CI test
# matrix runs the whole suite on 3.10, where anything 3.11+ fails at import.
python_version = "3.12"
# torch, timm and open_clip ship partial or absent stubs; checking against them
# produces noise about library internals rather than about this code.
ignore_missing_imports = true
